[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-data-audit"
version = "0.10.1"
description = "Robot Data Audit (RDA) - Quality auditing tool for robot datasets"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Niu Su Tech", email = "dev@niusutech.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "requests>=2.20",
]

[project.optional-dependencies]
# The LeRobot reader has two independent paths: the `lerobot` package, and a
# direct parquet reader that needs only pandas+pyarrow. `rda conform` reads
# parquet directly, so this group is what a plain install is missing.
# Verified 2026-10-27: `pip install robot-data-audit` followed by
# `rda conform <lerobot_dataset>` dies with "pyarrow is required" — pyarrow is
# otherwise only a transitive dep of lerobot>=0.6, which most users don't want.
parquet = ["pandas>=2.0", "pyarrow>=14.0"]
lerobot = ["lerobot>=0.6"]
video = ["av>=12.0"]
# Face detection inside pii_scan needs a Haar cascade. Verified 2026-10-13:
# opencv-python-headless 4.14.0 ships haarcascade_frontalface_default.xml,
# 5.0.0 ships none at all — hence the upper bound, not conservatism.
pii = ["opencv-python-headless>=4.8,<5"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]
ui = ["streamlit>=1.36.0", "plotly>=5.18.0", "pandas>=2.0"]
all = [
    "lerobot>=0.6",
    "av>=12.0",
    "opencv-python-headless>=4.8,<5",
    "streamlit>=1.36.0",
    "plotly>=5.18.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.scripts]
rda = "rda.cli.main:cli"

[project.urls]
Homepage = "https://github.com/liesliy/rda"
Documentation = "https://github.com/liesliy/rda#readme"
Issues = "https://github.com/liesliy/rda/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["rda*"]
exclude = ["server*"]
