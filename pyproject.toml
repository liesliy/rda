[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-data-audit"
version = "0.6.0"
description = "Robot Data Audit (RDA) - Quality auditing tool for robot datasets"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Niu Su Tech", email = "dev@niusutech.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "requests>=2.20",
]

[project.optional-dependencies]
lerobot = ["lerobot>=0.6"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]
ui = ["streamlit>=1.36.0", "plotly>=5.18.0", "pandas>=2.0"]
all = ["lerobot>=0.6", "streamlit>=1.36.0", "plotly>=5.18.0", "pandas>=2.0"]

[project.scripts]
rda = "rda.cli.main:cli"

[project.urls]
Homepage = "https://github.com/liesliy/rda"
Documentation = "https://github.com/liesliy/rda#readme"
Issues = "https://github.com/liesliy/rda/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["rda*"]
exclude = ["server*"]
