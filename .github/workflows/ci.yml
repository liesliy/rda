name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the real runtime dependencies for every test module so
      # nothing is silently skipped:
      #   - [video] pulls PyAV -> req4/req10 visual audit tests actually
      #     decode video instead of being skipped by importorskip("av")
      #   - [ui]    pulls streamlit/plotly/pandas -> UI + acceptance tests
      #   - numpy/pyarrow -> lerobot loader tests (importorskip numpy/pandas/
      #     pyarrow); the heavyweight lerobot package itself is not imported
      - name: Install package with full test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui,video]" numpy pyarrow pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Fail on unexpected skips
        run: |
          # Re-run in strict mode for the modules that used to be silently
          # skipped when their deps were missing; CI now installs those deps,
          # so a skip here means a regression.
          python -m pytest tests/test_req4_visual_integrity.py \
                           tests/test_req10_req11_visual_calibration.py \
                           tests/test_lerobot_loader_v30_libero.py \
                           tests/test_lerobot_task_identity.py \
                           -v -rs --no-header -o addopts=""

      - name: Verify closed-source layer stays out of the wheel
        run: |
          pip install build
          python -m build --wheel
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          leaked = [n for n in names if n.startswith("server/") or "engine_core" in n]
          assert not leaked, f"closed-source code leaked into wheel: {leaked}"
          assert any("ui_app" in n for n in names), "ui_app missing from wheel"
          print(f"wheel clean: {len(names)} files, no server/ or engine_core; ui_app present")
          EOF
